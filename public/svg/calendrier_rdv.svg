<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Style pour les coins arrondis et le texte -->
  <style>
    .bold-stroke {
      stroke: #000000;
      stroke-width: 32;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .text-rdv {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 110px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: -2px;
    }
  </style>

  <!-- Anneaux supérieurs du calendrier -->
  <line x1="220" y1="50" x2="220" y2="180" class="bold-stroke" />
  <line x1="580" y1="50" x2="580" y2="180" class="bold-stroke" />

  <!-- Corps principal du calendrier -->
  <path d="M 120,110 
           H 680 
           A 60,60 0 0,1 740,170 
           V 670 
           A 60,60 0 0,1 680,730 
           H 120 
           A 60,60 0 0,1 60,670 
           V 170 
           A 60,60 0 0,1 120,110 Z" 
        class="bold-stroke" />

  <!-- Ligne horizontale sous l'en-tête -->
  <line x1="60" y1="220" x2="740" y2="220" class="bold-stroke" />

  <!-- Grille de points (Jours du calendrier) -->
  <!-- Ligne 1 -->
  <line x1="150" y1="320" x2="200" y2="320" class="bold-stroke" />
  <line x1="280" y1="320" x2="330" y2="320" class="bold-stroke" />
  <line x1="410" y1="320" x2="460" y2="320" class="bold-stroke" />
  <line x1="540" y1="320" x2="590" y2="320" class="bold-stroke" />
  <line x1="670" y1="320" x2="690" y2="320" class="bold-stroke" />

  <!-- Ligne 2 -->
  <line x1="150" y1="420" x2="200" y2="420" class="bold-stroke" />
  <line x1="280" y1="420" x2="330" y2="420" class="bold-stroke" />
  <line x1="410" y1="420" x2="460" y2="420" class="bold-stroke" />
  <line x1="540" y1="420" x2="570" y2="420" class="bold-stroke" />

  <!-- Ligne 3 -->
  <line x1="150" y1="520" x2="200" y2="520" class="bold-stroke" />
  <line x1="280" y1="520" x2="330" y2="520" class="bold-stroke" />
  <line x1="410" y1="520" x2="440" y2="520" class="bold-stroke" />

  <!-- Ligne 4 -->
  <line x1="150" y1="620" x2="200" y2="620" class="bold-stroke" />
  <line x1="280" y1="620" x2="330" y2="620" class="bold-stroke" />
  <line x1="410" y1="620" x2="440" y2="620" class="bold-stroke" />

  <!-- Badge circulaire en bas à droite -->
  <!-- Fond blanc pour masquer les lignes arrière-plan -->
  <circle cx="650" cy="650" r="180" fill="#ffffff" />
  <!-- Contour du cercle -->
  <circle cx="650" cy="650" r="180" class="bold-stroke" />

  <!-- Texte RDV centré dans le cercle -->
  <text x="650" y="655" class="text-rdv">RDV</text>
</svg>